name: Deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      # web/'s own source, plus everything its build depends on: the root
      # package's src/ (built into the dist/ that web/ depends on via its
      # workspace-local "bitshaper" dependency) and the root package
      # manifests. A change to only src/ (e.g. a new primitive or curated
      # catalog content) still needs to redeploy the site, since it changes
      # what the built web app actually shows.
      - "web/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build --workspace web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
